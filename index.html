<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Shape</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f5f5f5;
    }

    .box {
      width: 300px;
      height: 300px;
      background-color: blue;
      transition: 0.3s;
    }

    /* Breakpoint 1：手機 */
    @media (max-width: 600px) {
      .box {
        background-color: red;
        border-radius: 50%;
      }
    }

    /* Breakpoint 2：桌面 */
    @media (min-width: 901px) {
      .box {
        background-color: green;
        transform: rotate(45deg);
        border-radius: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="box"></div>

</body>
</html>
